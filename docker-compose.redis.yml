# Production Redis for a single VPS (Coolify / plain Docker Compose).
#
# Redis backs presence, the Socket.IO adapter, rate limiting and the persisted
# 3-minute vet-disconnect deadlines (ZSET). Because deadlines live in Redis, keys must
# never be evicted and data must survive restarts.
#
# Usage:
#   REDIS_PASSWORD=<long-random-secret> docker compose -f docker-compose.redis.yml up -d
# Then set on the backend (same Docker network / Coolify service):
#   REDIS_URL=redis://default:<REDIS_PASSWORD>@redis:6379
# If the backend runs outside this Compose network, publish the port only on a private
# interface and prefer a TLS terminator (then use rediss://).

services:
  redis:
    image: redis:7-alpine
    container_name: huellicam-redis-prod
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}

volumes:
  redis_prod_data:
    name: huellicam_redis_prod_data
